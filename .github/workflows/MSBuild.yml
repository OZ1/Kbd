# Сборка и релизъ одной разкладки. Вызывается изъ KbdSlav.yml и KbdLat.yml.
name: Сборка

on:
  workflow_call:
    inputs:
      layout:                   # KbdSlav, KbdLat — папка, проектъ и имя dll
        required: true
        type: string
      ref:                      # коммитъ для ручного запуска; пусто — коммитъ события
        required: false
        type: string
        default: ''

jobs:
  # Версія разкладки. Прежняя — наибольшій тегъ <Name>-a.b.c.d (ставитъ publish).
  # Папка разкладки (кромѣ картинокъ) съ того тега не мѣнялась — версія прежняя, тегъ не ставится.
  # Иначе: FILEVERSION изъ MyKbd*.rc новѣе прежней — берётся онъ; нѣтъ — прежняя a.b.c.d → a.b+1.c.d+1.
  # Релизъ — только если съ прежняго тега измѣнилась разкладка, Install-Kbd.ps1, Kbd.cmd или ея Setup;
  # правки README и прочаго релиза не даютъ.
  # Въ репозиторій ничего не коммитится: повышенная версія живётъ только въ сборкѣ и въ тегѣ.
  version:
    runs-on: windows-latest
    outputs:
      fv:      ${{ steps.v.outputs.fv }}
      pv:      ${{ steps.v.outputs.pv }}
      release: ${{ steps.v.outputs.release }}
      sha:     ${{ steps.v.outputs.sha }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0          # вся исторія и теги — для сравненія съ прежнимъ тегомъ
    - id: v
      shell: pwsh
      env:
        NAME: ${{ inputs.layout }}
        GH_TOKEN: ${{ github.token }}
      run: |
        function Test-Changed([string] $since, [string[]] $paths) {
            if (-not $since) { return $true }
            git diff --quiet $since HEAD -- $paths ':!*.png' ':!*.jpg'
            [bool]$LASTEXITCODE
        }
        $name = $env:NAME
        $t    = [IO.File]::ReadAllText("$name\My$name.rc")
        $rc   = [version]([regex]::Match($t, '(?m)^\s*FILEVERSION\s+([\d, ]+)').Groups[1].Value -replace '\s' -replace ',', '.')
        $prev = git tag -l "$name-*" | ForEach-Object { $_.Substring($name.Length + 1) -as [version] } |
                Where-Object { $_ } | Sort-Object | Select-Object -Last 1
        $prevTag = if ($prev) { "$name-$prev" }
        $tag = $true
        if (-not (Test-Changed $prevTag $name)) {
            $fv  = $prev
            $pv  = "$($fv.Major).$($fv.Minor)"
            $how = "не мѣнялась съ $prevTag"
            $tag = $false
        } elseif ($prev -and $rc -le $prev) {
            $fv  = [version]::new($prev.Major, $prev.Minor + 1, $prev.Build, $prev.Revision + 1)
            $pv  = "$($fv.Major).$($fv.Minor)"
            $how = "повышена отъ $prevTag"
        } else {
            $fv  = $rc
            $pv  = [regex]::Match($t, '"ProductVersion",\s*"([^"]+)"').Groups[1].Value
            $how = if ($prev) { "изъ .rc, новѣе $prevTag" } else { 'изъ .rc, тегов нѣтъ' }
        }
        "${name}: $fv ($pv) — $how"
        $release = $tag
        # Скриптъ установки идётъ въ архивъ, Setup — въ MSI: ихъ правка — тоже поводъ для релиза
        if (-not $release -and (Test-Changed $prevTag 'Install-Kbd.ps1', 'Kbd.cmd', 'Setup/Kbd.wxs', 'Setup/Directory.Build.props', "Setup/$name.wixproj")) {
            $release = $true
            "Install-Kbd.ps1 / Kbd.cmd / Setup измѣнились съ $prevTag"
        }
        # Тегъ могли поставить и запушить руками, безъ релиза: тогда релизъ ещё не выложенъ
        if (-not $release -and $prevTag) {
            gh release view $prevTag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE) {
                $release = $true
                "Тегъ $prevTag есть, а релиза нѣтъ"
            }
        }
        if (-not $release) { 'Исходники съ послѣдняго релиза не мѣнялись — релиза не будетъ' }
        "fv=$fv"   >> $env:GITHUB_OUTPUT
        "pv=$pv"   >> $env:GITHUB_OUTPUT
        "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
        # Полный SHA: ref ручного запуска можетъ быть короткимъ, а --target релиза его не принимаетъ
        "sha=$(git rev-parse HEAD)"                >> $env:GITHUB_OUTPUT
        # Иначе Actions выйдетъ съ $LASTEXITCODE послѣдняго git diff --quiet (1 = есть измѣненія)
        exit 0

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, Win32, ARM64]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.version.outputs.sha }}
    - uses: microsoft/setup-msbuild@v3
    # Версію изъ job version — въ .rc рабочей копіи (только для этой сборки)
    - shell: pwsh
      env:
        NAME: ${{ inputs.layout }}
        FV:   ${{ needs.version.outputs.fv }}
        PV:   ${{ needs.version.outputs.pv }}
      run: |
        $p = "$env:NAME\My$env:NAME.rc"
        $v = [version]$env:FV
        $t = [IO.File]::ReadAllText($p)
        $t = [regex]::Replace($t, '(?m)^(\s*FILEVERSION\s+)\d[\d, ]*\d',    { param($m) $m.Groups[1].Value + "$($v.Major),$($v.Minor),$($v.Build),$($v.Revision)" })
        $t = [regex]::Replace($t, '(?m)^(\s*PRODUCTVERSION\s+)\d[\d, ]*\d', { param($m) $m.Groups[1].Value + "$($v.Major),$($v.Minor),0,0" })
        $t = [regex]::Replace($t, '("ProductVersion",\s*")[^"]*"',          { param($m) $m.Groups[1].Value + $env:PV + '"' })
        [IO.File]::WriteAllText($p, $t, [Text.UTF8Encoding]::new($true))
        Select-String -Path $p -Pattern 'VERSION' | ForEach-Object Line
    - run: msbuild ${{inputs.layout}}/${{inputs.layout}}.vcxproj /m /p:Configuration=Release /p:Platform=${{matrix.platform}}
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{inputs.layout}} ${{matrix.platform}}
        path: bin\out\Release-${{matrix.platform}}-${{inputs.layout}}\${{inputs.layout}}.dll
        if-no-files-found: error

  # Два архива (<Name>-amd64.zip, <Name>-arm64.zip): родная сборка въ System32, 32-битная въ SysWOW64, плюсъ скриптъ установки.
  # Плюсъ три MSI (Setup\<Name>.wixproj): <Name>.msi — одинъ на x64 и ARM64, и <Name>-amd64.msi, <Name>-arm64.msi — по одной родной dll.
  # 32-битной Windows архива нѣтъ: Win32-сборка идётъ съ BUILD_WOW6432 и годна только для SysWOW64.
  # Релизъ «<ProductVersion> <Name>» на тегѣ версіи <Name>-a.b.c.d — по нему слѣдующая сборка узнаётъ прежнюю версію.
  # Тегъ ставитъ gh release create; если релизъ уже есть, дозагружаются лишь недостающіе файлы —
  # выложенные не замѣняются, какъ и на Pages.
  # MSI той же версіи — на Pages, съ таблицею всѣхъ выкладокъ въ index.html.
  publish:
    needs: [version, build]
    if: >-
      github.event_name != 'pull_request' && needs.version.outputs.release == 'true'
    runs-on: windows-latest
    # Обѣ разкладки пишутъ въ gh-pages — по очереди
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.version.outputs.sha }}
    - uses: actions/download-artifact@v8.0.1
      with:
        path: out
    - shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ inputs.layout }}
        FV:   ${{ needs.version.outputs.fv }}
        PV:   ${{ needs.version.outputs.pv }}
        SHA:  ${{ needs.version.outputs.sha }}
      run: |
        # .dll → \System32
        $ErrorActionPreference = 'Stop'
        $n = $env:NAME
        $files = foreach ($z in @{ amd64 = 'x64'; arm64 = 'ARM64' }.GetEnumerator()) {
            $d = "pkg\$($z.Key)"
            New-Item -ItemType Directory "$d\System32", "$d\SysWOW64" | Out-Null
            Copy-Item "out\$n $($z.Value)\$n.dll" "$d\System32\"
            Copy-Item "out\$n Win32\$n.dll" "$d\SysWOW64\"
            Copy-Item Install-Kbd.ps1, Kbd.cmd $d
            Compress-Archive "$d\*" "$n-$($z.Key).zip"
            "$n-$($z.Key).zip"
        }
        # Общій MSI (<Name>.msi) и по одному на архитектуру (<Name>-amd64.msi, <Name>-arm64.msi)
        $msi = foreach ($a in '', 'amd64', 'arm64') {
            $arch = if ($a) { "-p:Arch=$a" }
            $out  = if ($a) { "$n-$a" } else { $n }
            dotnet build Setup\$n.wixproj -c Release -p:DllDir="$PWD\out" $arch -nologo | Out-Host
            if ($LASTEXITCODE) { exit 1 }
            Copy-Item "Setup\bin\x64\Release\$out.msi" .
            "$out.msi"
        }
        $files += $msi

        # Pages (ветка gh-pages): ссылки для Microsoft Store — прямыя, безъ редиректа, съ версіей въ адресѣ:
        #   https://oz1.github.io/Kbd/<Name>/<a.b.c.d>/<Name>[-amd64|-arm64].msi
        # Уже выложенную версію не перезаписываемъ: Store требуетъ, чтобы файлъ по ссылкѣ не мѣнялся.
        git fetch origin gh-pages
        git worktree add pages -B gh-pages origin/gh-pages
        $d = "pages\$n\$env:FV"
        if (-not (Test-Path $d)) {
            New-Item -ItemType Directory $d | Out-Null
            Copy-Item $msi $d
        }
        # index.html — таблица всѣхъ выкладокъ всѣхъ разкладокъ, новыя сверху.
        # Дата — коммита, которымъ версія легла въ gh-pages; новая — сегодня.
        $today = Get-Date -Format 'yyyy-MM-dd'
        $html = @(
            '<!DOCTYPE html>'
            '<html lang="ru">'
            '<head>'
            '<meta charset="utf-8">'
            '<title>Kbd</title>'
            '<style>body{font-family:sans-serif;margin:2em}table{border-collapse:collapse;margin-top:.5em}th,td{border:1px solid #ccc;padding:.3em .8em;text-align:left}.g{display:flex;flex-wrap:wrap;gap:1em 3em;align-items:flex-start}summary{font-size:1.5em;font-weight:bold;cursor:pointer}</style>'
            '</head>'
            '<body>'
            '<h1>Kbd</h1>'
            '<div class="g">'
        )
        foreach ($l in Get-ChildItem pages -Directory -Filter 'Kbd*' | Sort-Object Name -Descending) {
            $ln = $l.Name
            $html += "<details open><summary>$ln</summary>"
            $html += '<table>'
            $html += "<tr><th>Дата</th><th>Версія</th><th>msi</th><th>amd64</th><th>arm64</th></tr>"
            $vers = Get-ChildItem $l.FullName -Directory | Where-Object { $_.Name -as [version] } |
                    Sort-Object { [version]$_.Name } -Descending
            foreach ($v in $vers) {
                $date = git -C pages log --format=%cs -- "$ln/$($v.Name)" | Select-Object -Last 1
                if (-not $date) { $date = $today }
                $cells = foreach ($f in "$ln.msi", "$ln-amd64.msi", "$ln-arm64.msi") {
                    if (Test-Path "$($v.FullName)\$f") { "<td><a href=""$ln/$($v.Name)/$f"">$f</a></td>" } else { '<td>—</td>' }
                }
                $html += "<tr><td>$date</td><td>$($v.Name)</td>$($cells -join '')</tr>"
            }
            $html += '</table>', '</details>'
        }
        $html += '</div>', '</body>', '</html>', ''
        [IO.File]::WriteAllText("$PWD\pages\index.html", $html -join "`r`n")
        git -C pages add -A
        git -C pages diff --cached --quiet
        if ($LASTEXITCODE) {
            git -C pages -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "$env:FV $n"
            git -C pages push origin gh-pages
            if ($LASTEXITCODE) { exit 1 }
        }

        $tag   = "$n-$env:FV"
        $title = "$env:PV $n"
        gh release view $tag 2>$null
        if ($LASTEXITCODE) {
            gh release create $tag $files --target $env:SHA --title $title --notes $env:FV
            if ($LASTEXITCODE) { exit 1 }
        } else {
            $have = @(gh release view $tag --json assets -q '.assets[].name')
            $new  = @($files | Where-Object { $_ -notin $have })
            if ($new) {
                gh release upload $tag $new
                if ($LASTEXITCODE) { exit 1 }
            } else { "${tag}: всѣ файлы уже выложены" }
        }
        exit 0
